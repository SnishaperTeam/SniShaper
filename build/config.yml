# Configuration for the Wails v3 CLI (`wails3 dev`, `wails3 update build-assets`,
# `wails3 tool msix`). Values mirror Package.appxmanifest, which stays the
# single release-version source; keep `info` in sync when it is bumped.
version: '3'

info:
  companyName: "dongle"
  productName: "Snishaper"
  productIdentifier: "dongle.Snishaper"
  description: "SniShaper - Cloudflare IP Shaper"
  copyright: "Copyleft（著佐权） (c) Snishaper Team and JetCPP Team"
  comments: "SniShaper desktop application"
  version: "1.29.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .idea
      - .workbuddy
      - build/bin
      - frontend/dist
      - frontend/node_modules
      - node_modules
      - reference
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
