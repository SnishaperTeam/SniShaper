name: update-go-version-badge

on:
  push:
    branches:
      - main
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-go-version-badge
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Go version badge
        shell: bash
        run: |
          set -euo pipefail
          min_go="$(sed -nE 's/^go[[:space:]]+([0-9]+\.[0-9]+).*$/\1/p' go.mod | head -n1)"
          if [[ -z "$min_go" ]]; then
            echo "::error::Unable to determine minimum Go version from go.mod"
            exit 1
          fi
          export MIN_GO="$min_go"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          minimum = os.environ["MIN_GO"]
          old = r"https://img.shields.io/badge/Go(?:最低版本|版本)-[0-9]+\.[0-9]+(?:%2B|\+)-00ADD8"
          new = f"https://img.shields.io/badge/Go最低版本-{minimum}%2B-00ADD8"
          updated, count = re.subn(old, new, text, count=1)
          if count != 1:
              raise SystemExit("Go version badge not found")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit README changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: sync minimum Go version badge"
          git push
