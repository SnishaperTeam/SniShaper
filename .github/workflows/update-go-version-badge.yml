name: update-go-version-badge

on:
  push:
    branches:
      - main
  issue_comment:
    types:
      - created
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: update-go-version-badge
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name != 'issue_comment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update minimum Go version badge
        shell: bash
        run: |
          set -euo pipefail
          min_go="$(sed -nE 's/^go[[:space:]]+([0-9]+\.[0-9]+).*$/\1/p' go.mod | head -n1)"
          if [[ -z "$min_go" ]]; then
            echo "::error::Unable to determine minimum Go version from go.mod"
            exit 1
          fi
          export MIN_GO="$min_go"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          minimum = os.environ["MIN_GO"]
          readmes = {
              "README.md": {
                  "badge": r"https://img.shields.io/badge/Go(?:最低版本|版本)-[0-9]+\.[0-9]+(?:%2B|\+)-00ADD8",
                  "badge_new": f"https://img.shields.io/badge/Go最低版本-{minimum}%2B-00ADD8",
              },
              "README_EN.md": {
                  "badge": r"https://img.shields.io/badge/Go-[0-9]+\.[0-9]+(?:%2B|\+)-00ADD8",
                  "badge_new": f"https://img.shields.io/badge/Go-{minimum}%2B-00ADD8",
              },
              "README_RU.md": {
                  "badge": r"https://img.shields.io/badge/Go-[0-9]+\.[0-9]+(?:%2B|\+)-00ADD8",
                  "badge_new": f"https://img.shields.io/badge/Go-{minimum}%2B-00ADD8",
              },
          }

          for filename, config in readmes.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(config["badge"], config["badge_new"], text, count=1)
              if count != 1:
                  raise SystemExit(f"Go version badge not found in {filename}")
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit README badge changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md README_RU.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: sync minimum Go version badges"
          git push

  migrate-readme:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.number == 122 && github.event.comment.body == '/migrate-readme' && github.actor == 'dongzheyu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.issue.pull_request.head.repo.full_name }}
          ref: ${{ github.event.issue.pull_request.head.ref }}
          fetch-depth: 0

      - name: Run README migration
        shell: bash
        run: |
          set -euo pipefail
          python3 ./.github/scripts/merge_contributor_activity.py

      - name: Restore badge-only workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/update-go-version-badge.yml <<'EOF'
          name: update-go-version-badge

          on:
            push:
              branches:
                - main
            schedule:
              - cron: "37 3 * * 1"
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: update-go-version-badge
            cancel-in-progress: true

          jobs:
            update:
              if: github.actor != 'github-actions[bot]'
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v7

                - name: Update minimum Go version badge
                  shell: bash
                  run: |
                    set -euo pipefail
                    min_go="$(sed -nE 's/^go[[:space:]]+([0-9]+\.[0-9]+).*$/\1/p' go.mod | head -n1)"
                    if [[ -z "$min_go" ]]; then
                      echo "::error::Unable to determine minimum Go version from go.mod"
                      exit 1
                    fi
                    export MIN_GO="$min_go"
                    python3 - <<'PY'
                    import os
                    import re
                    from pathlib import Path

                    minimum = os.environ["MIN_GO"]
                    readmes = {
                        "README.md": {
                            "badge": r"https://img.shields.io/badge/Go(?:最低版本|版本)-[0-9]+\.[0-9]+(?:%2B|\+)-00ADD8",
                            "badge_new": f"https://img.shields.io/badge/Go最低版本-{minimum}%2B-00ADD8",
                        },
                        "README_EN.md": {
                            "badge": r"https://img.shields.io/badge/Go-[0-9]+\.[0-9]+(?:%2B|\+)-00ADD8",
                            "badge_new": f"https://img.shields.io/badge/Go-{minimum}%2B-00ADD8",
                        },
                        "README_RU.md": {
                            "badge": r"https://img.shields.io/badge/Go-[0-9]+\.[0-9]+(?:%2B|\+)-00ADD8",
                            "badge_new": f"https://img.shields.io/badge/Go-{minimum}%2B-00ADD8",
                        },
                    }

                    for filename, config in readmes.items():
                        path = Path(filename)
                        text = path.read_text(encoding="utf-8")
                        updated, count = re.subn(config["badge"], config["badge_new"], text, count=1)
                        if count != 1:
                            raise SystemExit(f"Go version badge not found in {filename}")
                        path.write_text(updated, encoding="utf-8")
                    PY

                - name: Commit README badge changes
                  shell: bash
                  run: |
                    set -euo pipefail
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add README.md README_EN.md README_RU.md
                    if git diff --cached --quiet; then
                      exit 0
                    fi
                    git commit -m "docs: sync minimum Go version badges"
                    git push
          EOF

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: merge contributor and activity sections"
          git push
