name: build

# Single build workflow for both direct pushes and pull requests
# (winget-pkgs style: one workflow, no workflow_run chain, bots invoked
# from inside the build itself).
#
#   push(main)                                   -> build only
#   pull_request(opened/synchronize/reopened)    -> CLA gate + build + bots
#   workflow_dispatch(pr_number set, called by
#     cla.yml after the agreement is signed)     -> CLA gate + build + bots
#   workflow_dispatch(no pr_number, manual)      -> build only
#
# Bot label writes never re-trigger this workflow (labeled is not a trigger
# type), so the labeled -> workflow -> label feedback loop of the previous
# two-workflow design cannot exist.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (set by cla.yml after signing)
        required: false
        type: string

# One build per PR (or per branch); a newer push cancels the stale matrix.
concurrency:
  group: build-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# GitHub-hosted runners reach the canonical module proxy directly, so CI uses
# the official source only. The build scripts default to a mirror-first
# fallback list for users behind networks where proxy.golang.org is
# unreachable; an explicit GOPROXY here overrides that default.
env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  # ------------------------------------------------------------------
  # CLA gate — only for pull requests (and post-signing dispatches).
  # Direct pushes to main and plain manual dispatches skip it entirely.
  # ------------------------------------------------------------------
  gate:
    name: gate
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '')
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide CLA gate
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          proceed=false
          if [ -n "${AUTHOR:-}" ] && is_exempt "$AUTHOR"; then
            proceed=true
          fi
          labels="$(gh_retry gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if grep -qx 'cla-signed' <<<"$labels"; then
            proceed=true
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Mark the CI round as running as soon as the gate passes.
  # ------------------------------------------------------------------
  mark-running:
    name: mark CI running
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/create-github-app-token@v3
        id: syntax_token
        with:
          app-id: ${{ secrets.SYNTAX_BOT_APP_ID }}
          private-key: ${{ secrets.SYNTAX_BOT_PRIVATE_KEY }}

      - name: Add ci-running label
        env:
          GH_TOKEN: ${{ steps.syntax_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          # sync_labels clears ci-failed/ci-passed (mutual-exclusion group)
          # plus syntax-review, changes-requested and approved (new round)
          # automatically.
          sync_labels "$PR_NUMBER" "ci-running" ""

  # ------------------------------------------------------------------
  # GUI matrix — one (platform, arch) pair per job, GUI builds only.
  # The CLI is pure Go with CGO_ENABLED=0 and is produced by the dedicated
  # CLI jobs below (windows/linux cross-built once on windows-latest,
  # darwin built natively on macOS runners), so nothing is built twice.
  #
  # ARM64 GUI targets never use a cross toolchain:
  #   linux/arm64  -> ubuntu-26.04-arm   (native ARM64 Linux runner)
  #   windows/arm64-> windows-latest     (Go emits windows/arm64 with
  #                                       CGO_ENABLED=0; switch to a native
  #                                       Windows ARM64 runner when available)
  #
  # Every job also greps its build log for aarch64-linux-gnu / osxcross and
  # fails if a cross toolchain shows up. This workflow is build + smoke only:
  # packaging (MSIX / 7z / tar.gz) happens in the release pipeline.
  #
  # Runs unconditionally for direct pushes / manual dispatches; for pull
  # requests only when the gate passed.
  # ------------------------------------------------------------------
  matrix-build:
    name: GUI ${{ matrix.platform }}/${{ matrix.arch }} on ${{ matrix.runner }}
    needs: gate
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '') ||
       needs.gate.outputs.proceed == 'true')
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            script: ps1
          - runner: windows-latest
            platform: windows
            arch: x86
            script: ps1
          - runner: windows-latest
            platform: windows
            arch: arm64
            script: ps1
          - runner: ubuntu-26.04
            platform: linux
            arch: x64
            script: sh
          - runner: ubuntu-26.04-arm
            platform: linux
            arch: arm64
            script: sh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux GUI dependencies (GTK4 / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build GUI (build.sh --ci)
        if: matrix.script == 'sh'
        shell: bash
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh --ci --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --type gui 2>&1 | tee build.log
          if grep -Eqi 'aarch64-linux-gnu|osxcross' build.log; then
            echo "::error::cross toolchain detected in a CI build"
            exit 1
          fi

      - name: Build GUI (build_windows.ps1 -CI)
        if: matrix.script == 'ps1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build_windows.ps1 -CI -Platform "${{ matrix.platform }}" -Arch "${{ matrix.arch }}" -Type gui *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build_windows.ps1 failed"
            exit $LASTEXITCODE
          }
          $bad = Select-String -Path build.log -Pattern 'aarch64-linux-gnu|osxcross' -ErrorAction SilentlyContinue
          if ($bad) {
            Write-Host "::error::cross toolchain detected in a CI build"
            exit 1
          }

      - name: Verify artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          find build/bin -type f \( -name 'SniShaper' -o -name 'snishaper.exe' \) -print -exec file {} \;

      - name: Verify artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $machines = @{ 0x8664 = 'x64'; 0xAA64 = 'arm64'; 0x014C = 'x86' }
          $bins = Get-ChildItem -Path build\bin -Recurse -Include 'snishaper.exe'
          if (-not $bins) { Write-Host "::error::no binary produced"; exit 1 }
          $bins | ForEach-Object {
            $fs = [System.IO.File]::OpenRead($_.FullName)
            $fs.Seek(0x3C, 'Begin') | Out-Null
            $buf = New-Object byte[] 4
            $fs.Read($buf, 0, 4) | Out-Null
            $pe = [BitConverter]::ToUInt32($buf, 0)
            $fs.Seek($pe + 4, 'Begin') | Out-Null
            $m = New-Object byte[] 2
            $fs.Read($m, 0, 2) | Out-Null
            $fs.Close()
            $id = [BitConverter]::ToUInt16($m, 0)
            Write-Host ("{0} -> {1}" -f $_.FullName, $machines[$id])
          }

  # ------------------------------------------------------------------
  # CLI: Windows + Linux, cross-built once on a Windows runner. Pure Go,
  # CGO_ENABLED=0, no cross toolchain. Darwin is handled natively below.
  # ------------------------------------------------------------------
  cli-build:
    name: CLI (windows + linux, 5 targets)
    needs: gate
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '') ||
       needs.gate.outputs.proceed == 'true')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build CLI targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build_windows.ps1 -CI -Platform windows,linux -Type cli -Silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify all five targets exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'build\bin\cli\Windows\x64\snishaper.exe',
            'build\bin\cli\Windows\x86\snishaper.exe',
            'build\bin\cli\Windows\arm64\snishaper.exe',
            'build\bin\cli\Linux\x64\snishaper',
            'build\bin\cli\Linux\arm64\snishaper'
          )
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) { Write-Host "::error::missing $f"; exit 1 }
            Write-Host "built: $f"
          }

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (& .\build\bin\cli\Windows\x64\snishaper.exe version).Trim()
          Write-Host "::notice::CLI version: $v"
          if (-not $v) { Write-Host "::error::empty CLI version"; exit 1 }
          & .\build\bin\cli\Windows\x64\snishaper.exe help | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::CLI help failed"; exit 1 }

  # ------------------------------------------------------------------
  # CLI: Darwin, built natively and smoke-tested on real macOS runners.
  #   darwin/x64  -> macos-26-intel (last x86_64 image, EOL Aug 2027)
  #   darwin/arm64-> macos-26      (Apple Silicon)
  # ------------------------------------------------------------------
  darwin-cli:
    name: CLI ${{ matrix.platform }}/${{ matrix.arch }} on ${{ matrix.runner }}
    needs: gate
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '') ||
       needs.gate.outputs.proceed == 'true')
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            platform: darwin
            arch: x64
          - runner: macos-26
            platform: darwin
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build CLI (build.sh --ci)
        shell: bash
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh --ci --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --type cli 2>&1 | tee build.log
          if grep -Eqi 'aarch64-linux-gnu|osxcross' build.log; then
            echo "::error::cross toolchain detected in a CI build"
            exit 1
          fi

      - name: Verify and smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="build/bin/cli/Darwin/${{ matrix.arch }}/snishaper"
          file "$BIN"
          chmod +x "$BIN"
          V="$("$BIN" version)"
          echo "::notice::CLI (${{ matrix.platform }}/${{ matrix.arch }}) version: $V"
          if [ -z "$V" ]; then echo "::error::empty CLI version"; exit 1; fi
          "$BIN" help >/dev/null

  # ------------------------------------------------------------------
  # Stable single-point summary used as the required status check in
  # branch protection ("ci"). Succeeds when every build job succeeded
  # or was skipped (gate-skipped PR runs skip the whole matrix); fails on
  # any real failure so a red build blocks the merge.
  # ------------------------------------------------------------------
  ci:
    name: ci
    needs: [gate, matrix-build, cli-build, darwin-cli]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Assert build outcome
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq '[.[] | select(.result != "success" and .result != "skipped")] | length' <<<"$RESULTS")"
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi
          echo "all required CI jobs succeeded (or were skipped)"

  # ------------------------------------------------------------------
  # Bots — invoked directly from the build (no separate listener
  # workflow). Only for pull-request rounds that passed the gate; label
  # writes never re-trigger this workflow, so there is no feedback loop.
  # ------------------------------------------------------------------
  bot-report:
    name: Report CI result (syntax-bot)
    needs: [gate, ci]
    if: >-
      always() && !cancelled() &&
      needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN grants for the diagnostic log download; comment and
      # label writes go through the syntax-bot App token instead.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/create-github-app-token@v3
        id: syntax_token
        with:
          app-id: ${{ secrets.SYNTAX_BOT_APP_ID }}
          private-key: ${{ secrets.SYNTAX_BOT_PRIVATE_KEY }}

      - name: Diagnose failure and mark changes requested
        if: needs.ci.result == 'failure'
        env:
          GH_TOKEN: ${{ steps.syntax_token.outputs.token }}
          LOG_GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          body="<!-- snishaper-bot:ci-diagnostic -->
          $(.github/scripts/bots/ci-diagnose.sh "$PR_NUMBER" "$RUN_ID")"
          bot_comment "$PR_NUMBER" "snishaper-bot:ci-diagnostic" "$body"
          # CI failure is itself a bot review verdict: mark the PR as
          # changes-requested so the state machine reaches its terminal
          # state without waiting for a human review.
          sync_labels "$PR_NUMBER" "ci-failed,changes-requested" ""

      - name: Mark CI passed and complete syntax review
        if: needs.ci.result == 'success'
        env:
          GH_TOKEN: ${{ steps.syntax_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          sync_labels "$PR_NUMBER" "ci-passed,syntax-review" ""
