name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install WinApp CLI
        shell: pwsh
        run: |
          if (Get-Command winapp -ErrorAction SilentlyContinue) {
            Write-Host "winapp already available"
          } else {
            winget install --id Microsoft.WinAppCLI -e --source winget --disable-interactivity --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0) {
              Write-Host "winget failed, trying GitHub release..." -ForegroundColor Yellow
              $url = "https://github.com/microsoft/winappCli/releases/download/v0.6.0/winappcli_x64.msix"
              Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\winappcli_x64.msix" -ErrorAction Stop
              Add-AppxPackage -Path "$env:TEMP\winappcli_x64.msix" -ErrorAction Stop
              # Add-AppxPackage doesn't add to PATH; find the installed location
              $pkg = Get-AppxPackage -Name "*WinApp*" | Select-Object -First 1
              $installPath = $pkg.InstallLocation
              Add-Content -Path $env:GITHUB_PATH -Value $installPath
            }
          }
          winapp --version

      - name: Install 7-Zip
        run: choco install 7zip -y --no-progress

      - name: Build, package & sign MSIX
        shell: pwsh
        run: ./build_windows.ps1 -Build windows,gui,all -InstallDeps -BuildMsix -Silent

      - name: Create 7z archive
        run: 7z a -mx=9 snishaper-windows-amd64.7z .\build\bin\*

      - name: Create cert install batch
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path Apppackage -Filter "*.msix" | Select-Object -First 1
          $bat = '@echo off', 'chcp 65001 > nul', "echo Installing certificate to Trusted Root Certification Authorities...", "certutil -f -importpfx `"%~dp0devcert.pfx`" password", "echo Installing MSIX package...", "powershell -Command `"Add-AppxPackage -Path '%~dp0$($msix.Name)'`"", "echo Done!", "pause"
          $bat -join "`r`n" | Set-Content -Path install.bat

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item (Get-Item Apppackage\*.msix).FullName staging\ -ErrorAction Stop
          Copy-Item (Get-Item snishaper-windows-amd64.7z).FullName staging\ -ErrorAction Stop
          if (Test-Path devcert.pfx) { Copy-Item devcert.pfx staging\ }
          if (Test-Path install.bat) { Copy-Item install.bat staging\ }
          Write-Host "Staged files:" -ForegroundColor Green
          Get-ChildItem staging | ForEach-Object { Write-Host "  $($_.Name)" }

  linux-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK4/WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build Linux
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh --with-frontend
          test -f build/bin/SniShaper && echo "::notice::build/bin/SniShaper ready"

      - name: Smoke test binary
        run: |
          set -euo pipefail
          file build/bin/SniShaper
          ./build/bin/SniShaper --version 2>&1 | head -5 || true

  cli-build:
    name: CLI build (all targets)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build CLI (6 targets)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platforms = @("windows", "linux", "darwin")
          $archs = @("amd64", "arm64")
          foreach ($goos in $platforms) {
            foreach ($goarch in $archs) {
              $name = "snishaper-cli-$goos-$goarch"
              if ($goos -eq "windows") { $name += ".exe" }
              Write-Host "building $goos/$goarch -> $name"
              $env:GOOS = $goos
              $env:GOARCH = $goarch
              $env:CGO_ENABLED = "0"
              go build -tags "with_gvisor headless" -ldflags "-s -w" -o $name ./cli
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          Remove-Item Env:GOOS, Env:GOARCH, Env:CGO_ENABLED -ErrorAction SilentlyContinue

      - name: Smoke test
        shell: pwsh
        run: |
          .\snishaper-cli-windows-amd64.exe version
          .\snishaper-cli-windows-amd64.exe help | Out-Null
          Write-Host "CLI 6-target build OK" -ForegroundColor Green
