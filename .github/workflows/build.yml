name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ------------------------------------------------------------------
  # GUI matrix — one (platform, arch) pair per job, GUI builds only.
  # The CLI is pure Go with CGO_ENABLED=0 and is produced by the dedicated
  # CLI jobs below (windows/linux cross-built once on windows-latest,
  # darwin built natively on macOS runners), so nothing is built twice.
  #
  # ARM64 GUI targets never use a cross toolchain:
  #   linux/arm64  -> ubuntu-24.04-arm   (native ARM64 Linux runner)
  #   windows/arm64-> windows-latest     (Go emits windows/arm64 with
  #                                       CGO_ENABLED=0; switch to a native
  #                                       Windows ARM64 runner when available)
  #
  # Every job also greps its build log for aarch64-linux-gnu / osxcross and
  # fails if a cross toolchain shows up. This workflow is build + smoke only:
  # packaging (MSIX / 7z / tar.gz) happens in the release pipeline.
  # ------------------------------------------------------------------
  matrix-build:
    name: GUI ${{ matrix.platform }}/${{ matrix.arch }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            script: ps1
          - runner: windows-latest
            platform: windows
            arch: x86
            script: ps1
          - runner: windows-latest
            platform: windows
            arch: arm64
            script: ps1
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            script: sh
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            script: sh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux GUI dependencies (GTK4 / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build GUI (build.sh --ci)
        if: matrix.script == 'sh'
        shell: bash
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh --ci --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --type gui 2>&1 | tee build.log
          if grep -Eqi 'aarch64-linux-gnu|osxcross' build.log; then
            echo "::error::cross toolchain detected in a CI build"
            exit 1
          fi

      - name: Build GUI (build_windows.ps1 -CI)
        if: matrix.script == 'ps1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build_windows.ps1 -CI -Platform "${{ matrix.platform }}" -Arch "${{ matrix.arch }}" -Type gui *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build_windows.ps1 failed"
            exit $LASTEXITCODE
          }
          $bad = Select-String -Path build.log -Pattern 'aarch64-linux-gnu|osxcross' -ErrorAction SilentlyContinue
          if ($bad) {
            Write-Host "::error::cross toolchain detected in a CI build"
            exit 1
          }

      - name: Verify artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          find build/bin -type f \( -name 'SniShaper' -o -name 'snishaper.exe' \) -print -exec file {} \;

      - name: Verify artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $machines = @{ 0x8664 = 'x64'; 0xAA64 = 'arm64'; 0x014C = 'x86' }
          $bins = Get-ChildItem -Path build\bin -Recurse -Include 'snishaper.exe'
          if (-not $bins) { Write-Host "::error::no binary produced"; exit 1 }
          $bins | ForEach-Object {
            $fs = [System.IO.File]::OpenRead($_.FullName)
            $fs.Seek(0x3C, 'Begin') | Out-Null
            $buf = New-Object byte[] 4
            $fs.Read($buf, 0, 4) | Out-Null
            $pe = [BitConverter]::ToUInt32($buf, 0)
            $fs.Seek($pe + 4, 'Begin') | Out-Null
            $m = New-Object byte[] 2
            $fs.Read($m, 0, 2) | Out-Null
            $fs.Close()
            $id = [BitConverter]::ToUInt16($m, 0)
            Write-Host ("{0} -> {1}" -f $_.FullName, $machines[$id])
          }

  # ------------------------------------------------------------------
  # CLI: Windows + Linux, cross-built once on a Windows runner. Pure Go,
  # CGO_ENABLED=0, no cross toolchain. Darwin is handled natively below.
  # ------------------------------------------------------------------
  cli-build:
    name: CLI (windows + linux, 5 targets)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build CLI targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build_windows.ps1 -CI -Platform windows,linux -Type cli -Silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify all five targets exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'build\bin\cli\Windows\x64\snishaper.exe',
            'build\bin\cli\Windows\x86\snishaper.exe',
            'build\bin\cli\Windows\arm64\snishaper.exe',
            'build\bin\cli\Linux\x64\snishaper',
            'build\bin\cli\Linux\arm64\snishaper'
          )
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) { Write-Host "::error::missing $f"; exit 1 }
            Write-Host "built: $f"
          }

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (& .\build\bin\cli\Windows\x64\snishaper.exe version).Trim()
          Write-Host "::notice::CLI version: $v"
          if (-not $v) { Write-Host "::error::empty CLI version"; exit 1 }
          & .\build\bin\cli\Windows\x64\snishaper.exe help | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::CLI help failed"; exit 1 }

  # ------------------------------------------------------------------
  # CLI: Darwin, built natively and smoke-tested on real macOS runners.
  #   darwin/x64  -> macos-15-intel (macos-13 was retired 2025-12-04)
  #   darwin/arm64-> macos-14      (Apple Silicon)
  # ------------------------------------------------------------------
  darwin-cli:
    name: CLI ${{ matrix.platform }}/${{ matrix.arch }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-14
            platform: darwin
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build CLI (build.sh --ci)
        shell: bash
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh --ci --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --type cli 2>&1 | tee build.log
          if grep -Eqi 'aarch64-linux-gnu|osxcross' build.log; then
            echo "::error::cross toolchain detected in a CI build"
            exit 1
          fi

      - name: Verify and smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="build/bin/cli/Darwin/${{ matrix.arch }}/snishaper"
          file "$BIN"
          chmod +x "$BIN"
          V="$("$BIN" version)"
          echo "::notice::CLI (${{ matrix.platform }}/${{ matrix.arch }}) version: $V"
          if [ -z "$V" ]; then echo "::error::empty CLI version"; exit 1; fi
          "$BIN" help >/dev/null

  # ------------------------------------------------------------------
  # README maintenance runs only after every build target succeeds on a
  # push to main. It updates contributor data in all three README files and
  # keeps the activity and contributor sections merged.
  # ------------------------------------------------------------------
  maintain-readme:
    name: Maintain README contributors
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs:
      - matrix-build
      - cli-build
      - darwin-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Collect contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/contributors?anon=1&per_page=100" > "$RUNNER_TEMP/contributors.json"

      - name: Merge activity and contributor sections
        env:
          CONTRIBUTORS_JSON: ${{ runner.temp }}/contributors.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          from pathlib import Path

          contributors_data = json.loads(Path(os.environ["CONTRIBUTORS_JSON"]).read_text(encoding="utf-8"))
          contributors = [item for page in contributors_data for item in page]

          humans = []
          for contributor in contributors:
              login = str(contributor.get("login") or "").strip()
              name = str(contributor.get("name") or "").strip()
              contributor_type = str(contributor.get("type") or "").strip().lower()
              if contributor_type == "bot" or login.lower().endswith("[bot]"):
                  continue
              humans.append({
                  "login": login,
                  "name": name or login or "Anonymous contributor",
                  "contributions": int(contributor.get("contributions") or 0),
                  "url": str(contributor.get("html_url") or "").strip(),
                  "avatar": str(contributor.get("avatar_url") or "").strip(),
              })

          humans.sort(key=lambda item: (-item["contributions"], item["name"].lower()))

          def contributor_block(language):
              if language == "zh":
                  intro = "本节由 GitHub Actions 自动维护。贡献者来自 GitHub 的提交统计，机器人账号会被排除；核心贡献者按提交数从高到低取前三名。"
                  core_title = "核心贡献者"
                  all_title = "全部贡献者"
                  rank = "排名"
                  core_name = "核心贡献者"
                  commits = "提交数"
                  empty = "暂无贡献者数据。"
              elif language == "en":
                  intro = "This section is maintained automatically by GitHub Actions. Contributors are based on GitHub commit statistics; bot accounts are excluded, and the top three contributors by commit count are listed as core contributors."
                  core_title = "Core Contributors"
                  all_title = "All Contributors"
                  rank = "Rank"
                  core_name = "Core Contributor"
                  commits = "Commits"
                  empty = "No contributor data available."
              else:
                  intro = "Этот раздел автоматически обновляется GitHub Actions. Участники определяются по статистике коммитов GitHub; аккаунты-боты исключаются, а три участника с наибольшим числом коммитов считаются основными участниками."
                  core_title = "Основные участники"
                  all_title = "Все участники"
                  rank = "Место"
                  core_name = "Основной участник"
                  commits = "Коммиты"
                  empty = "Данные об участниках отсутствуют."

              rows = [f"| {rank} | {core_name} | {commits} |", "| ---: | --- | ---: |"]
              for index, contributor in enumerate(humans[:3], 1):
                  display_name = html.escape(contributor["name"])
                  if contributor["url"]:
                      display = f'<a href="{html.escape(contributor["url"], quote=True)}">{display_name}</a>'
                  else:
                      display = display_name
                  rows.append(f"| {index} | {display} | {contributor['contributions']} |")
              if len(rows) == 2:
                  rows.append(f"| — | {empty} | 0 |")

              avatar_items = []
              for contributor in humans:
                  if contributor["url"] and contributor["avatar"]:
                      label = html.escape(contributor["login"] or contributor["name"])
                      avatar_items.append(
                          f'<a href="{html.escape(contributor["url"], quote=True)}" title="{label}">'
                          f'<img src="{html.escape(contributor["avatar"], quote=True)}" width="48" height="48" alt="{label}" />'
                          f'</a>'
                      )
                  else:
                      avatar_items.append(html.escape(contributor["name"]))

              avatar_lines = [" ".join(avatar_items[i:i + 8]) for i in range(0, len(avatar_items), 8)]
              avatars = "\n".join(avatar_lines) if avatar_lines else empty

              return "\n".join([
                  "<!-- CONTRIBUTORS:START -->",
                  intro,
                  "",
                  f"### {core_title}",
                  "",
                  *rows,
                  "",
                  f"### {all_title}",
                  "",
                  '<div align="center">',
                  avatars,
                  "</div>",
                  "<!-- CONTRIBUTORS:END -->",
              ])

          configurations = [
              {
                  "path": "README.md",
                  "language": "zh",
                  "section": "项目活跃度与贡献者",
                  "license": "许可",
                  "old_contributor": r"## 贡献者\n.*?(?=\n## 星标历史|\n## Star History)",
                  "old_activity": r"## 项目活跃度与贡献者\n.*?(?=\n---\n\n## 许可)",
                  "graph": None,
              },
              {
                  "path": "README_EN.md",
                  "language": "en",
                  "section": "Project Activity & Contributors",
                  "license": "License",
                  "old_contributor": r"## Contributors\n.*?(?=\n## Star History)",
                  "old_activity": r"## Project Activity & Contributors\n.*?(?=\n---\n\n## License)",
                  "graph": ("### Core Contributors", "### Contributors Graph"),
              },
              {
                  "path": "README_RU.md",
                  "language": "ru",
                  "section": "Активность проекта и участники",
                  "license": "Лицензия",
                  "old_contributor": r"## Участники\n.*?(?=\n## История звёзд|\n## Star History)",
                  "old_activity": r"## Активность проекта и участники\n.*?(?=\n---\n\n## Лицензия)",
                  "graph": ("### Основные участники", "### Граф участников"),
              },
          ]

          for config in configurations:
              path = Path(config["path"])
              text = path.read_text(encoding="utf-8")

              activity_match = re.search(config["old_activity"], text, re.S)
              if activity_match:
                  activity_body = activity_match.group(0).split("\n", 1)[1].strip()
                  text = text[:activity_match.start()] + text[activity_match.end():]
              else:
                  section_re = re.compile(r"## " + re.escape(config["section"]) + r"\n.*?(?=\n---\n\n## " + re.escape(config["license"]) + r")", re.S)
                  merged_match = section_re.search(text)
                  if not merged_match:
                      raise SystemExit(f"merged activity section not found in {config['path']}")
                  body = merged_match.group(0).split("\n", 1)[1].strip()
                  marker_match = re.search(r"<!-- CONTRIBUTORS:START -->.*?<!-- CONTRIBUTORS:END -->", body, re.S)
                  activity_body = body[marker_match.end():].strip() if marker_match else body
                  text = text[:merged_match.start()] + text[merged_match.end():]

              text = re.sub(config["old_contributor"], "", text, count=1, flags=re.S)
              if config["graph"]:
                  activity_body = activity_body.replace(config["graph"][0], config["graph"][1], 1)

              merged_section = (
                  f"## {config['section']}\n\n"
                  + contributor_block(config["language"])
                  + "\n\n"
                  + activity_body.strip()
              )

              license_marker = f"\n---\n\n## {config['license']}"
              if license_marker not in text:
                  raise SystemExit(f"license marker not found in {config['path']}")
              text = text.replace(license_marker, "\n---\n\n" + merged_section + license_marker, 1)
              path.write_text(text.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Commit README maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md README_RU.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update contributors [skip ci]"
          git push