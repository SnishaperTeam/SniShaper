name: macos

# macOS 菜单栏应用（SnishaperBar）的构建与打包验证。
#
# 触发：macos/ 目录或根 go.mod/依赖变化、手动触发。
# 覆盖：Apple Silicon（macos-26）与 Intel（macos-26-intel）原生 runner，
# swift build 编译菜单栏应用 + headless CLI 构建 + bundle-app.sh 打包
# SniShaper.app 并校验结构。发布产物不在此工作流上传（release 流程负责）。
on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'cli/**'
      - 'app/**'
      - 'core/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'macos/**'
      - 'cli/**'
      - 'app/**'
      - 'core/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  bar:
    name: SnishaperBar ${{ matrix.arch }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 菜单栏应用本体：纯文本 swift build，无需 Xcode 工程。不运行产物
      # ——它进入 NSApplication 事件循环不会退出。
      - name: Build SnishaperBar (swift)
        working-directory: macos
        run: |
          set -euo pipefail
          swift build -c release --disable-sandbox
          file .build/release/SnishaperBar

      # 状态契约：headless CLI 必须能输出 status --json（Swift 端解析）。
      - name: Build headless CLI and verify status contract
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh --ci --platform darwin --arch "$(go env GOARCH)" --type cli
          BIN="build/bin/cli/Darwin/$(go env GOARCH)/snishaper"
          chmod +x "$BIN"
          OUT="$("$BIN" status --json)"
          echo "status --json: $OUT"
          echo "$OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "service" in d, "missing service key"'

      # 完整打包：SniShaper.app 结构校验。
      - name: Bundle SniShaper.app
        run: |
          set -euo pipefail
          chmod +x macos/scripts/bundle-app.sh
          macos/scripts/bundle-app.sh
          APP="build/bin/macos/SniShaper.app"
          test -x "$APP/Contents/MacOS/SnishaperBar"
          test -x "$APP/Contents/Resources/bin/snishaper"
          test -f "$APP/Contents/Info.plist"
          test -f "build/bin/macos/SniShaper-macos-$(uname -m).zip"
          echo "::notice::bundled SniShaper.app ($(uname -m))"
