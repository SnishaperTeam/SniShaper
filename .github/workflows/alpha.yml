name: Release (Alpha)

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Prerelease suffix (defaults to alpha.1 if empty), e.g. alpha.2"
        required: false
        type: string
        default: ""
      msix_version:
        description: "MSIX Identity version, e.g. 1.29.0.0; follows the base version only, never the channel. Empty keeps the current manifest version"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    name: Alpha Prerelease
    uses: ./.github/workflows/_release_pipeline.yml
    with:
      channel: alpha
      prerelease: true
      version_suffix: ${{ inputs.version_suffix || 'alpha.1' }}
      msix_version: ${{ inputs.msix_version }}
    secrets: inherit
