name: unit-test

# Generates unit-test files for pure helpers (via .github/scripts/gen_tests)
# and executes the Go unit-test suite. Keeps the repository continuously
# covered without hand-writing every test.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate & run unit tests
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate unit-test files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./.github/scripts/gen_tests -root "$env:GITHUB_WORKSPACE"
          echo "--- changed generated files ---"
          git status --porcelain

      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'unit-test.log'
          $cover = Join-Path $env:RUNNER_TEMP 'cover.out'
          go test -tags with_gvisor -race -coverprofile="$cover" `
            ./proxy/... ./pkg/... ./common/... 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "go test failed with exit code ${LASTEXITCODE}"
            exit 1
          }
          if (Select-String -Path $log -Pattern '^(FAIL|--- FAIL)') {
            Write-Error "unit tests failed"
            exit 1
          }

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: ${{ runner.temp }}/unit-test.log
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $cover = Join-Path $env:RUNNER_TEMP 'cover.out'
          if (Test-Path $cover) {
            $line = go tool cover -func=$cover | Select-Object -Last 1
            if ($line) { Write-Output "Coverage: $line" }
            else { Write-Output "Coverage: (parse failed)" }
          } else {
            Write-Output "Coverage: (no cover.out found)"
          }
          $LASTEXITCODE = 0

      # On manual dispatch only, offer any newly generated test files back as a
      # pull request so a human can review them before merging. Skipped on push
      # and pull_request to avoid self-triggering loops.
      - name: Open PR for newly generated tests
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: gen-tests/update
          title: "chore: update generated unit tests"
          commit-message: "chore: regenerate unit tests"
          body: |
            Auto-generated by `.github/scripts/gen_tests`.

            These files contain unit tests for pure helper functions. Review
            before merging; then re-run the `unit-test` workflow to confirm.
          delete-branch: true
