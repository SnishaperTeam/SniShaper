name: cla

# Contributor-guidelines hint driven by the SniShaper Policy Bot App
# identity. CI runs on every pull request with no gate (see build.yml);
# this workflow never blocks or unlocks anything:
#   pull_request_target[opened,reopened] -> exemption check ->
#     guidelines hint comment (anchor upsert) + reviewer assignment
#
# The hint flow MUST use pull_request_target, not pull_request: fork PRs
# hide repository secrets from plain pull_request events, so the policy-bot
# App token step would always fail exactly for external contributors. This
# workflow never checks out the fork head - checkout stays on the base ref
# and the job only calls the GitHub API - so pull_request_target is safe
# here.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guidance:
    name: Guidelines hint and reviewers (policy-bot)
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check exemption state
        id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          skip=false
          if is_exempt "$AUTHOR"; then
            echo "author is a bot - no guidelines hint needed"
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        if: steps.check.outputs.skip != 'true'
        id: policy_token
        with:
          app-id: ${{ secrets.POLICY_BOT_APP_ID }}
          private-key: ${{ secrets.POLICY_BOT_PRIVATE_KEY }}

      - name: Publish guidelines hint comment
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.policy_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          body="<!-- snishaper-bot:cla-guidance -->
          ## 📋 Contributor guidelines

          Thank you for opening this pull request! CI is already running — no confirmation is needed to start it.

          Before your changes are reviewed, please make sure you have read:

          - [\`docs/CODE_OF_CONDUCT.md\`](https://github.com/${GH_REPO}/blob/main/docs/CODE_OF_CONDUCT.md) — code of conduct
          - [\`docs/COLLABORATOR_AGREEMENT.md\`](https://github.com/${GH_REPO}/blob/main/docs/COLLABORATOR_AGREEMENT.md) — contributor agreement

          A maintainer will review your changes soon."
          bot_comment "$PR_NUMBER" "snishaper-bot:cla-guidance" "$body"

      - name: Assign reviewers (policy-bot, idempotent)
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.policy_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          # Reviewers are assigned as soon as the PR opens, so they can
          # follow it from the start. Read the existing requested
          # reviewers and the PR author first; only request the missing,
          # non-author reviewers so repeated triggers never duplicate
          # requests. GitHub rejects author review requests with 422, so
          # the author is skipped explicitly.
          author="$(gh_retry gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" \
            --jq '.user.login')"
          current="$(gh_retry gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" \
            --jq '[.requested_reviewers[].login] | join(",")')"
          to_request=""
          for reviewer in Snishaper dongle-china; do
            if [ "$reviewer" = "$author" ]; then
              echo "::notice::skipping reviewer ${reviewer}: the PR author cannot review their own PR"
              continue
            fi
            case ",${current}," in
              *",${reviewer},"*) ;;
              *) to_request="${to_request:+${to_request},}${reviewer}" ;;
            esac
          done
          if [ -n "$to_request" ]; then
            # Direct API call: gh pr edit silently swallows invalid
            # reviewer errors (exit 0), the API surfaces them.
            args=()
            for r in ${to_request//,/ }; do
              args+=(-f "reviewers[]=${r}")
            done
            gh_retry gh api -X POST \
              "repos/${GH_REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
              "${args[@]}" >/dev/null
          fi
          sync_labels "$PR_NUMBER" "reviewers-assigned" ""
