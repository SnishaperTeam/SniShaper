version: 2

updates:
  # Go modules: weekly, grouped into one PR
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-modules:
        patterns:
          - "*"

  # Frontend npm: weekly, grouped into one PR
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-deps:
        patterns:
          - "*"

  # GitHub Actions: weekly (even though updates are rare), grouped
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly          # 从 monthly 改为 weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"