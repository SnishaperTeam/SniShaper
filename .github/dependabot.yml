version: 2

registries:
  snishaper:
    type: git
    url: https://github.com/SnishaperTeam/SniShaper.git

updates:
  # Go modules: all bumps in ONE PR, monthly, 14-day cooldown
  - package-ecosystem: gomod
    directory: /
    registries:
      - snishaper
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      go-modules:
        patterns:
          - "*"

  # Frontend npm: grouped, weekly, skip brand-new releases
  - package-ecosystem: npm
    directory: /frontend
    registries:
      - snishaper
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      frontend-deps:
        patterns:
          - "*"

  # GitHub Actions: grouped into one PR
  - package-ecosystem: github-actions
    directory: /
    source:
      type: git
      url: https://github.com/SnishaperTeam/SniShaper.git
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
