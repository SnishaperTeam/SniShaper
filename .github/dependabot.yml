version: 2

updates:
  # Go modules: check once every 1 day, grouped into one PR.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    groups:
      go-modules:
        patterns:
          - "*"

  # Frontend npm: check once every 1 day, grouped into one PR.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    # Registry mirrors (npmmirror) lag behind npmjs: @iconify-icons/material-symbols
    # 2.0.8 is published upstream but missing from the mirror, so installs 404.
    # Keep it pinned at 2.0.7 until the mirror catches up.
    ignore:
      - dependency-name: "@iconify-icons/material-symbols"
        versions:
          - ">2.0.7"
    groups:
      frontend-deps:
        patterns:
          - "*"

  # GitHub Actions: check once every 1 day, grouped into one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
